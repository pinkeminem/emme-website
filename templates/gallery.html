{% extends "base.html" %}
{% block title %}emme - gallery{% endblock %}
{% block head %}
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Calibri, 'Trebuchet MS', sans-serif; background: #000; color: #ccc; min-height: 100vh; padding: 40px 40px 60px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
        .logo { height: 35px; width: auto; }
        .back { color: #666; text-decoration: none; font-size: 12px; }
        .back:hover { color: #fff; }
        h1 { font-weight: normal; font-size: 14px; margin-bottom: 40px; color: #888; letter-spacing: 1px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .gallery-item { position: relative; aspect-ratio: 1; overflow: hidden; background: #0a0a0a; cursor: pointer; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) contrast(1.1); opacity: 0.8; transition: all 0.4s ease; }
        .gallery-item:hover img { filter: grayscale(0%) contrast(1); opacity: 1; transform: scale(1.03); }
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; cursor: pointer; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .lightbox-close { position: absolute; top: 20px; right: 30px; color: #666; font-size: 24px; cursor: pointer; }
        .lightbox-close:hover { color: #fff; }
        @media (max-width: 768px) {
            body { padding: 40px 20px 60px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        }
    </style>
{% endblock %}
{% block body %}
    <div class="header">
        <a href="{{ url_for('public.index') }}"><img src="{{ url_for('static', filename='images/logo-scrawl.png') }}" alt="emme" class="logo"></a>
        <a href="{{ url_for('public.live') }}" class="back">&larr; back</a>
    </div>
    <h1>gallery</h1>
    <div class="gallery-grid">
        {% for img in images %}
        <div class="gallery-item"><img src="{{ url_for('static', filename=img.filename) }}" alt="{{ img.alt_text }}" loading="lazy"></div>
        {% endfor %}
    </div>
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img src="" alt="">
    </div>
    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = lightbox.querySelector('img');
        document.querySelectorAll('.gallery-item img').forEach(img => {
            img.addEventListener('click', () => { lightboxImg.src = img.src; lightbox.classList.add('active'); });
        });
        lightbox.addEventListener('click', () => { lightbox.classList.remove('active'); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.classList.remove('active'); });
    </script>
{% endblock %}
