<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emme - admin dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Calibri, 'Trebuchet MS', sans-serif; background: #111; color: #ccc; min-height: 100vh; padding: 40px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 60px; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        h1 { font-weight: normal; font-size: 14px; color: #888; letter-spacing: 1px; }
        .logout { color: #444; text-decoration: none; font-size: 11px; }
        .logout:hover { color: #fff; }
        .view-site { color: #444; text-decoration: none; font-size: 11px; margin-right: 15px; }
        .view-site:hover { color: #fff; }
        .page-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .page-card { background: #1a1a1a; border: 1px solid #222; padding: 25px 20px; text-decoration: none; transition: all 0.3s; }
        .page-card:hover { border-color: #444; background: #1e1e1e; }
        .page-card-name { color: #ccc; font-size: 14px; margin-bottom: 5px; }
        .page-card-hint { color: #444; font-size: 10px; }
        .messages-card { position: relative; }
        .badge { position: absolute; top: 10px; right: 10px; background: #a46; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>admin dashboard</h1>
        </div>
        <div>
            <a href="{{ url_for('public.index') }}" class="view-site">view site</a>
            <a href="{{ url_for('admin.logout') }}" class="logout">logout</a>
        </div>
    </div>

    <div class="page-grid">
        {% for page in pages %}
        <a href="{{ page.url }}" class="page-card">
            <div class="page-card-name">{{ page.name }}</div>
            <div class="page-card-hint">edit content</div>
        </a>
        {% endfor %}

        <a href="{{ url_for('admin.messages') }}" class="page-card messages-card">
            <div class="page-card-name">Messages</div>
            <div class="page-card-hint">contact form submissions</div>
            {% if unread > 0 %}
            <span class="badge">{{ unread }}</span>
            {% endif %}
        </a>
    </div>
</body>
</html>
